services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      - '8123:8123'
      - '9000:9000'
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pbc-network

  ml-scorer:
    build:
      context: .
      dockerfile: docker/scorer/Dockerfile
    container_name: ml-scorer
    working_dir: /app
    volumes:
      - .:/app:delegated
    environment:
      MODEL_DIR: /app/output/models
      PYTHONPATH: /app/src
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - '8765:8000'
    networks:
      - pbc-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  clickhouse_data:
    driver: local

networks:
  pbc-network:
    external: true
