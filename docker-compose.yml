services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      - '8123:8123'
      - '9000:9000'
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pbc-network

  ml-scorer:
    image: python:3.12-slim
    container_name: ml-scorer
    working_dir: /app
    volumes:
      - .:/app:delegated
    environment:
      MODEL_DIR: /app/output/models
      PYTHONPATH: /app/src
    command:
      - bash
      - -c
      - |
        pip install --no-cache-dir scikit-learn==1.6.1 joblib numpy pandas loguru pydantic pydantic-settings python-dotenv tqdm &&
        pip install --no-cache-dir -e /app &&
        python /app/smoke_test.py &&
        echo 'ml-scorer stub ready — all 5 checks passed' &&
        tail -f /dev/null
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - '8765:8000'
    networks:
      - pbc-network

volumes:
  clickhouse_data:
    driver: local

networks:
  pbc-network:
    external: true
